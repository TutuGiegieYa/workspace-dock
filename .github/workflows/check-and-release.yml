name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (no real Codex sessions or Git network operations)
        run: npm test
      - name: Build explicit-file VSIX
        run: python3 scripts/package.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify version
        run: |
          python3 scripts/package.py
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Publish VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.vsix
          --repo "$GITHUB_REPOSITORY"
          --title "Workspace Dock $GITHUB_REF_NAME"
          --notes-file CHANGELOG.md
